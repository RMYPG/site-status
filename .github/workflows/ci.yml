name: CI

# Tests pull requests and builds their image without pushing it. A vX.Y.Z tag
# runs the same checks, then publishes ghcr.io/rmypg/site-status:vX.Y.Z.
# Publishing deploys nothing: RMYPG/platform pins the digest in a reviewed commit.
on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Each job declares what it needs; nothing is granted by default.
permissions: {}

concurrency:
  # A newer push to a pull request supersedes the older run. A tag's run always
  # finishes, and its group is its own ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.8

      - name: Lint and test
        run: mise run ci

  # Builds and starts the image with the workflow's read-only token. Only the
  # publish job, which pull requests never run, can write packages.
  image:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: site-status:ci

      # Run as production runs it: non-root, read-only root filesystem, no
      # capabilities. Starting proves the binary is static, because the base has
      # no libc. Outside a cluster the service must exit on the Kubernetes
      # client, which also proves it loaded its configuration first.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          status=0
          output=$(docker run --rm --read-only --user 65532:65532 --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$PWD/config.example.json:/etc/site-status/config.json:ro" \
            --env SITE_STATUS_CONFIG=/etc/site-status/config.json \
            site-status:ci 2>&1) || status=$?
          echo "$output"
          test "$status" -ne 0
          grep -q 'kubernetes client configuration' <<<"$output"

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels the image with org.opencontainers.image.source and .revision,
      # and tags it with the Git tag and no other name.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/rmypg/site-status
          flavor: latest=false
          tags: type=ref,event=tag

      - name: Publish the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
